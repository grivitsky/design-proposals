<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Design proposals</title>
  <meta name="description" content="Design proposals.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="/proximal-vc/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/proximal-vc/styles.css">
  <style>
    .index { padding: 112px 0 80px; }
    .index h1 { margin-bottom: 48px; }
    .index a {
      display: block;
      padding: 20px 0;
      border-top: 1px solid var(--line);
      text-decoration: none;
    }
    .index a strong {
      display: block;
      font-weight: 600;
      font-size: 21px;
      letter-spacing: -0.02em;
    }
    .index a span {
      display: block;
      margin-top: 4px;
      color: var(--slate);
      font-size: 14px;
    }
    .index a:hover strong { color: var(--link); }
  </style>
</head>
<body>
  <main class="index">
    <div class="shell">
      <h1>Design proposals</h1>
      <a href="/proximal-vc">
        <strong>Proximal Ventures</strong>
        <span>Design proposal · Mikita</span>
      </a>
    </div>
  </main>
</body>
</html>
